stages:
  - test

variables:
  GIT_DEPTH: "1"

test:
  stage: test
  image: gcc:15
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
      cmake
      pkg-config
      libsystemd-dev
      clang-tidy
      valgrind
      ca-certificates
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
    - cmake --build build -j$(nproc)
    - ctest --test-dir build --output-on-failure
    - ./build/tests/test_libseed
  artifacts:
    when: on_failure
    paths:
      - build/Testing/
    expire_in: 1 week
